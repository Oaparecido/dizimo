name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/${{ secrets.EC2_USER }}/app || {
              echo "App directory not found. Run setup first."
              exit 1
            }

            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            docker pull "$IMAGE"

            export IMAGE_TAG="${{ github.sha }}"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export APP_KEY="${{ secrets.APP_KEY }}"
            export APP_URL="${{ secrets.APP_URL }}"
            export DB_URL="${{ secrets.DB_URL }}"
            export APP_PORT="${APP_PORT:-80}"

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker system prune -f --filter "until=24h" 2>/dev/null || true
